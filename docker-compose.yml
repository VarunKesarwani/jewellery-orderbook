# Local development stack. Production runs behind Tailscale on a single host;
# this file is for a quick "everything up" on one machine.
#
# Usage:  docker compose up --build

services:
  api:
    build:
      context: ./src/api
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "5080:8080"

  web:
    build:
      context: ./src/web
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - api
