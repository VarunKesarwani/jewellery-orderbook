<header class="app-bar">
  <span class="brand">Jewellery Order Book</span>
  <nav>
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
    <a routerLink="/orders" routerLinkActive="active">Orders</a>
    <a routerLink="/payments" routerLinkActive="active">Payments</a>
    <a routerLink="/customers" routerLinkActive="active">Customers</a>
    <a routerLink="/reports" routerLinkActive="active">Reports</a>
  </nav>

  @if (auth.enabled) {
    @if (auth.signedIn()) {
      <span class="who">{{ auth.name() }}</span>
      <button type="button" class="who-button" (click)="auth.signOut()">Sign out</button>
    } @else {
      <button type="button" class="who-button" (click)="auth.signIn()">Sign in</button>
    }
  }
</header>

<main class="page">
  <router-outlet />
</main>
